# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-music-detector
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    # Optional keys for the live-performance checks. Render asks for them on first deploy; leave blank to skip those checks.
    envVars:
      - key: SETLISTFM_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_DAILY_LIMIT
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
